    "/method/frappe.desk.query_report.run": {
      "post": {
        "operationId": "run_report",
        "summary": "Run one native ERPNext report",
        "description": "Read-only native report. The company is fixed to the demo company, the report name is a closed list, and the filter object rejects undeclared fields. Native report permissions and validation apply.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "report_name",
                  "filters"
                ],
                "properties": {
                  "report_name": {
                    "type": "string",
                    "enum": [
                      "Trial Balance",
                      "Profit and Loss Statement",
                      "Balance Sheet",
                      "General Ledger",
                      "Accounts Receivable",
                      "Accounts Payable",
                      "Stock Balance",
                      "Stock Ledger",
                      "Warehouse Wise Stock Balance",
                      "Gross Profit",
                      "Sales Register",
                      "Purchase Register",
                      "Item-wise Sales Register"
                    ]
                  },
                  "filters": {
                    "type": "object",
                    "required": [
                      "company"
                    ],
                    "additionalProperties": false,
                    "properties": {
                      "company": {
                        "type": "string",
                        "enum": [
                          "Serendib Consumer Products (Pvt) Ltd"
                        ]
                      },
                      "from_date": {
                        "type": "string",
                        "format": "date"
                      },
                      "to_date": {
                        "type": "string",
                        "format": "date"
                      },
                      "period_start_date": {
                        "type": "string",
                        "format": "date"
                      },
                      "period_end_date": {
                        "type": "string",
                        "format": "date"
                      },
                      "report_date": {
                        "type": "string",
                        "format": "date"
                      },
                      "fiscal_year": {
                        "type": "string"
                      },
                      "from_fiscal_year": {
                        "type": "string"
                      },
                      "to_fiscal_year": {
                        "type": "string"
                      },
                      "warehouse": {
                        "type": "string"
                      },
                      "item_code": {
                        "type": "string"
                      },
                      "item_group": {
                        "type": "string"
                      },
                      "customer": {
                        "type": "string"
                      },
                      "supplier": {
                        "type": "string"
                      },
                      "include_zero_stock_items": {
                        "type": "integer",
                        "enum": [
                          0,
                          1
                        ]
                      },
                      "ignore_err": {
                        "type": "integer",
                        "enum": [
                          0,
                          1
                        ]
                      },
                      "ignore_cr_dr_metadata": {
                        "type": "integer",
                        "enum": [
                          0,
                          1
                        ]
                      },
                      "filter_based_on": {
                        "type": "string",
                        "enum": [
                          "Fiscal Year",
                          "Date Range"
                        ]
                      },
                      "group_by": {
                        "type": "string",
                        "enum": [
                          "Item",
                          "Item Group"
                        ]
                      }
                    }
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Native query report result",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "message"
                  ],
                  "properties": {
                    "message": {
                      "type": "object"
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
